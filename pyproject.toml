[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-pyspark-connector"
version = "0.2.0"
description = "Spark Structured Streaming source for Elexon's IRIS AMQP service"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dan Keeling", email = "danjkeeling@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "azure-servicebus>=7.11.0",
    "azure-identity>=1.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pyspark>=4.0.0",
]

[project.urls]
Source = "https://github.com/DanJKeeling/iris-streaming"

[tool.setuptools.packages.find]
include = ["iris_connector*"]
